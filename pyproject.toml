[project]
name = "auto-wheel"
version = "0.1.0"
description = "Automatically download Python wheel packages for offline installation"
authors = [
    {name = "Sgldbhxs", email = "xytcsust2019@163.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["offline", "pip", "wheel", "download", "requirements", "intranet"]
requires-python = ">=3.8"
dependencies = [
    "pip>=21.0",
    "packaging>=21.0",
    "tqdm>=4.62.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]

[project.urls]
Homepage = "https://github.com/yt-x/auto_wheel"
Repository = "https://github.com/yt-x/auto_wheel"
Issues = "https://github.com/yt-x/auto_wheel/issues"

[project.optional-dependencies]
gui = [
    "PyQt6>=6.7",
    "qt-material>=2.14",
]

[project.scripts]
auto-wheel = "auto_wheel.main:main"
auto-wheel-gui = "auto_wheel.gui.app:run"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
