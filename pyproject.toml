[project]
name = "auto-wheel"
version = "0.1.0"
description = "Automatically download Python wheel packages for offline installation"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pip>=21.0",
    "packaging>=21.0",
    "tqdm>=4.62.0",
    "pyqt6>=6.7",
    "qt-material>=2.14",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.7",
    "qt-material>=2.14",
]

[project.scripts]
auto-wheel = "auto_wheel.main:main"
auto-wheel-gui = "auto_wheel.gui.app:run"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
